name: Ubuntu

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

jobs:

  build-gcc:
    name: "gcc-${{ matrix.version }}"
    runs-on: ubuntu-24.04
    strategy:
        fail-fast: false
        matrix:
            version: [13, 14]
    steps:
    - uses: actions/checkout@v4

    - uses: actions/cache@v4
      with:
        path: "**/cpm_modules"
        key: ${{ github.workflow }}-cpm-modules-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}

    - name: set up GCC
      uses: egor-tensin/setup-gcc@v1
      with:
        version: ${{matrix.version}}
        platform: x64

    - name: configure gcc
      run: cmake -S . -B build -DTP_BUILD_EXAMPLES=OFF -DTP_BUILD_BENCHMARKS=OFF -DTP_THREAD_SANITIZER=OFF -DCMAKE_BUILD_TYPE=Debug

    - name: build
      run: cmake --build build -j4

    - name: test
      run: ctest --test-dir build --build-config Debug

  # GCC 16 is currently the only toolchain whose libstdc++ asserts counting_semaphore's
  # release() precondition, so this is the job that catches a regression of the
  # binary_semaphore over-release at runtime. libstdc++ turns _GLIBCXX_ASSERTIONS on
  # automatically for unoptimized builds, which is why this is a Debug build.
  build-gcc-assertions:
    name: "gcc-16 Debug + libstdc++ assertions"
    runs-on: ubuntu-24.04
    container: gcc:16
    steps:
    - uses: actions/checkout@v4

    - uses: actions/cache@v4
      with:
        path: "**/cpm_modules"
        key: ${{ github.workflow }}-cpm-modules-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}

    - name: install cmake
      run: |
        apt-get update
        apt-get install -y cmake ninja-build

    - name: configure
      run: cmake -S . -B build -G Ninja -DTP_BUILD_EXAMPLES=OFF -DTP_BUILD_BENCHMARKS=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-D_GLIBCXX_ASSERTIONS"

    - name: build
      run: cmake --build build -j4

    - name: test
      run: ctest --test-dir build --build-config Debug

  build-clang:
    name: "clang-${{matrix.version}}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        version: [18, 19, 20]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: "**/cpm_modules"
          key: ${{ github.workflow }}-cpm-modules-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}

      - name: Set up Clang
        run: |
          wget -O llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{matrix.version}}

      - name: configure clang
        run: cmake -S . -B build-clang -DTP_BUILD_EXAMPLES=OFF -DTP_BUILD_BENCHMARKS=OFF -DTP_THREAD_SANITIZER=OFF -DCMAKE_BUILD_TYPE=Debug
        env:
          CC: clang-${{matrix.version}}
          CXX: clang++-${{matrix.version}}

      - name: build
        run: cmake --build build-clang -j4

      - name: test clang
        run: ctest --test-dir build-clang --build-config Debug

  # A thread pool with no sanitizer coverage in CI is how the semaphore bug survived to release.
  build-tsan:
    name: "ThreadSanitizer"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: "**/cpm_modules"
          key: ${{ github.workflow }}-cpm-modules-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}

      - name: configure
        run: cmake -S . -B build-tsan -DTP_BUILD_EXAMPLES=OFF -DTP_BUILD_BENCHMARKS=OFF -DTP_THREAD_SANITIZER=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: build
        run: cmake --build build-tsan -j4

      - name: test
        run: ctest --test-dir build-tsan --build-config RelWithDebInfo
